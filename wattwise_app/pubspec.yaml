name: wattwise
description: WattWise - Unified Electricity Bill Management, Appliance Consumption Analysis, and Energy Insights App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  crypto: ^3.0.5
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  google_mlkit_text_recognition: ^0.13.1
  printing: ^5.13.3
  fl_chart: ^0.69.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
